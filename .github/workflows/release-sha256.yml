name: Publier l'asset .zip de la release

# A chaque release publiee : construit un .zip propre du projet (git archive) et
# l'attache a la release comme fichier telechargeable. Ce fichier est ce que
# l'application telecharge a la mise a jour (et il compte dans les downloads GitHub).
# La verification d'integrite repose sur HTTPS + le depot fige (pas de SHA256 dans les
# notes : une seule ligne ne peut pas convenir a la fois aux anciennes versions qui
# telechargent le zipball source et aux nouvelles qui telechargent l'asset).
# Le declenchement manuel (workflow_dispatch) permet de (re)traiter un tag existant.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release a traiter (ex: 4.9.12)"
        required: true

permissions:
  contents: write

jobs:
  asset:
    runs-on: ubuntu-latest
    steps:
      - name: Determiner le tag
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Checkout du tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Verifier que src/Version.ps1 correspond au tag
        run: |
          set -euo pipefail
          VER=$(grep -oE "[0-9]+\.[0-9]+\.[0-9]+" src/Version.ps1 | head -n1)
          CLEAN_TAG="${{ steps.tag.outputs.tag }}"; CLEAN_TAG="${CLEAN_TAG#v}"
          echo "Version.ps1 = $VER | tag = $CLEAN_TAG"
          if [ "$VER" != "$CLEAN_TAG" ]; then
            echo "::error::src/Version.ps1 ($VER) ne correspond pas au tag ($CLEAN_TAG)."
            exit 1
          fi

      - name: Construire et attacher l'asset .zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ZIP="Milestone-Toolkit-$TAG.zip"
          git archive --format=zip --prefix=Milestone-Toolkit/ -o "$ZIP" HEAD
          gh release upload "$TAG" "$ZIP" --clobber --repo "$REPO"
          echo "Asset $ZIP attache a la release $TAG."
